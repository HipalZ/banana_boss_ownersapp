<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    
    <!-- PWA Installation Support -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FDE047" />
    
    <!-- Apple iOS PWA Customizations -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Banana Boss" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        if (!navigator.serviceWorker.controller && 'PerformanceObserver' in window) {
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            const worker = navigator.serviceWorker.controller;
            if (!worker) return;
            const claimedAt = performance.now();
            const observer = new PerformanceObserver(list => {
              const urls = list.getEntries()
                .filter(entry => entry.startTime <= claimedAt)
                .map(entry => entry.name)
                .filter(name => {
                  const url = new URL(name);
                  return url.origin === location.origin && /^\/(assets|_expo\/static)\//.test(url.pathname);
                });
              if (urls.length) worker.postMessage({ type: 'warm-assets', urls });
            });
            observer.observe({ type: 'resource', buffered: true });
            // Allow pre-control font and image requests to finish on slow connections.
            setTimeout(() => observer.disconnect(), 60000);
          }, { once: true });
        }
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Expo PWA Service Worker registered successfully:', reg.scope))
            .catch(err => console.error('Expo PWA Service Worker registration failed:', err));
        });
      }
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
